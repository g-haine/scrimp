# Experimental modern CPU/MPI stack. Choose the *complex*, NON-CUDA
# PETSc/SLEPc builds; an unconstrained '*complex*' accidentally selected
# cuda13_complex on 2026-11-19 and pulled ~2 GiB of CUDA libraries.
# After native validation, freeze the explicit lock for releases.
name: scrimp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - setuptools
  - wheel
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - patch  # Apply pinned SCRIMP GetFEM source patches during Docker build
  - pkg-config
  - libtool
  - autoconf
  - automake
  - openmpi
  - mpi4py
  - mumps-mpi
  - metis
  - parmetis
  - scalapack
  # Native *CPU complex* PETSc/SLEPc, not cuda12_complex / cuda13_complex.
  # The build string must BEGIN with 'complex_' to exclude CUDA variants.
  # Python wrappers are built against these exact libraries + NumPy 2.
  - petsc=3.26.*=complex_*
  - slepc=3.26.*=complex_*
  - cython>=3
  - numpy>=2,<3
  - scipy
  - matplotlib-base
  - sympy
  - pydantic
  - pyyaml
  - pytest
  - sphinx
  - sphinx_rtd_theme
  - qhull
  - curl
  - ca-certificates
  - libglu
  - pip:
      - gmsh
