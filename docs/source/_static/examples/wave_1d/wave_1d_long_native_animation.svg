<title>Vibrating string — real 1.5-second native GetFEM simulation</title>
<desc>Actual native 150-step fixed Crank-Nicolson run at source 7e2e95a46645762ac09027428b5bb2abe8cff7a0. MUMPS MPI1, h=0.05, dt=0.01. This compact HTML animation displays every tenth accepted frame (16 original FE snapshots) at 11 of the 41 original P2 nodes, quantized to 0.001 for display. See full native archive for all 151 frames and 41 original q nodes. Incremental displacement is reconstructed by exact spatial P2 integration plus trapezoidal left-end velocity integration, with w(0,0)=0; it is not an independently solved state. No physical claims rely on this downsampled illustration.</desc>
