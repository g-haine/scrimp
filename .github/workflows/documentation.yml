name: Docs
on:
  push:
    branches-ignore:
      - feature/getfem55-mpi-container-scalability
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v2
      - name: Install sphinx dependencies
        run: |
          pip install sphinx sphinx_rtd_theme
      - name: Verify v1.3.0 documentation/source contract
        run: |
          python tests/test_v130_docs_release_source.py
          bash -n scripts/run-v130-docs-build.sh
          bash -n scripts/run-v130-example-user-output-smoke.sh
      - name: Docker-first source and standalone project contracts
        run: |
          python3 -m unittest -v tests.test_v130_docker_first_source tests.test_project_starter
          bash -n scripts/run-v130-docker-distribution-gate.sh
      - name: Audit pure-Python v1.3.0 wheel and isolated metadata install
        run: |
          python3 -m pip install --upgrade setuptools wheel
          python3 scripts/audit-v130-wheel.py
      - name: Sphinx HTML and LaTeX source builds
        run: |
          sphinx-build -n -W --keep-going -b html docs/source docs/build
          sphinx-build -n -W --keep-going -b latex docs/source docs/build/latex
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v2
        with:
          root_file: scrimp.tex
          working_directory: docs/build/latex/
      - name: Deploy on GitHub pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          force_orphan: true
