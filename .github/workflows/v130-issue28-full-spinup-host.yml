name: SCRIMP v1.3.0 #28 full spinup host gate

on:
  push:
    branches: [release/1.3.0-preparation]
    paths:
      - "sandbox/probe_v130_issue28_full_spinup.py"
      - "sandbox/compare_v130_issue28_full_spinup.py"
      - "sandbox/probe_v130_issue28_one_cn_spinup.py"
      - "sandbox/viscous_swe_2d_mpi.py"
      - "tests/test_v130_issue28_full_spinup.py"
      - "scripts/run-v130-issue28-full-spinup.sh"
      - ".github/workflows/v130-issue28-full-spinup-host.yml"
  pull_request:
    paths:
      - "sandbox/probe_v130_issue28_full_spinup.py"
      - "sandbox/compare_v130_issue28_full_spinup.py"
      - "tests/test_v130_issue28_full_spinup.py"
      - "scripts/run-v130-issue28-full-spinup.sh"
      - ".github/workflows/v130-issue28-full-spinup-host.yml"

jobs:
  full-spinup-source:
    name: Full C1 spinup syntax and negative controls (no PETSc)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host-only comparator dependency
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile every referenced full-spinup Python module
        run: |
          python -m py_compile \
            sandbox/probe_v130_issue28_one_cn_spinup.py \
            sandbox/probe_v130_issue28_full_spinup.py \
            sandbox/compare_v130_issue28_full_spinup.py \
            tests/test_v130_issue28_full_spinup.py
      - name: Validate pinned native launcher syntax
        run: bash -n scripts/run-v130-issue28-full-spinup.sh
      - name: Verify all host synthetic positive and negative controls
        run: python -m unittest -v tests.test_v130_issue28_full_spinup
