jobs:
  source-only-production-methods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: NumPy dependency for source-only interval test
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Syntax
        run: |
          python -m py_compile scrimp/utils/fe_initialization.py tests/test_v130_fe_initial_projection.py sandbox/probe_v130_production_fe_initialization.py
          python -m py_compile scrimp/dphs.py scrimp/utils/dae_initialization.py tests/test_v130_direct_linear_feedback.py tests/test_v130_dae_substituted_intervals.py sandbox/probe_v130_intrinsic_vector_fem_initialization.py
          python -m py_compile tests/test_v130_dae_algebraic_block_diagnostics.py sandbox/probe_v130_heat_wave_dae_feasibility.py
          bash -n scripts/run-v130-heat-wave-dae-feasibility.sh
          python -m py_compile sandbox/probe_v130_heat_wave_boundary_compatibility.py tests/test_v130_heat_wave_boundary_compatibility.py
          bash -n scripts/run-v130-heat-wave-boundary-compatibility.sh
          python -m py_compile sandbox/probe_v130_heat_wave_compatible_cn.py tests/test_v130_heat_wave_compatible_cn.py
          bash -n scripts/run-v130-heat-wave-compatible-cn.sh
          python -m py_compile tests/test_v130_heat_wave_superlu_step_diagnostic.py
          bash -n scripts/run-v130-heat-wave-superlu-step-diagnostic.sh
          python -m py_compile sandbox/probe_v130_hw_cn_identical_lu.py tests/test_v130_hw_cn_identical_lu.py
          bash -n scripts/run-v130-hw-cn-identical-lu.sh
          python -m py_compile sandbox/probe_v130_hw_superlu_permutation_sweep.py tests/test_v130_hw_superlu_permutation_sweep.py
          bash -n scripts/run-v130-hw-superlu-permutation-sweep.sh
          python -m py_compile sandbox/probe_v130_hw_cn_exact_row_matching.py tests/test_v130_hw_cn_exact_row_matching.py
          bash -n scripts/run-v130-hw-cn-exact-row-matching.sh
          python -m py_compile sandbox/probe_v130_hw_matching_pc.py sandbox/probe_v130_hw_matched_pc_snapshot.py sandbox/probe_v130_hw_matched_pc_cn.py tests/test_v130_hw_matched_pc.py
          bash -n scripts/run-v130-hw-matched-PC-cn.sh
          python -m py_compile sandbox/compare_v130_hw_cn_matched_lu_parity.py tests/test_v130_hw_cn_matched_lu_parity.py
          bash -n scripts/run-v130-hw-cn-matched-lu-parity.sh
          python -m py_compile sandbox/probe_v130_intrinsic_l2_projection.py sandbox/probe_v130_intrinsic_affine_projection.py sandbox/probe_v130_universal_fem_initialization.py
          bash -n scripts/run-v130-intrinsic-fem-initialization.sh
          bash -n scripts/run-v130-intrinsic-l2-projection.sh
          bash -n scripts/run-v130-intrinsic-affine-projection.sh
          bash -n scripts/run-v130-universal-fem-initialization.sh
          bash -n scripts/run-v130-production-fe-initialization.sh
          python -m py_compile sandbox/probe_v130_fe_initial_mpi.py
          bash -n scripts/run-v130-fe-initial-mpi.sh
          bash -n scripts/run-v130-fe-initial-coo.sh
          python -m py_compile tests/test_v130_universal_fe_projection_spec.py tests/test_v130_nonlinear_coo_assembly.py
          python -m py_compile sandbox/probe_v130_nonlinear_coo_dynamic_graph.py
          bash -n scripts/run-v130-nonlinear-coo-mpi.sh
      - name: Actual DPHS control classification and GetFEM assembly routing
        run: python tests/test_v130_direct_linear_feedback.py
      - name: Source-only production substituted DAE interval classification
        run: python tests/test_v130_dae_substituted_intervals.py
      - name: Native IFunction algebraic block residual failure diagnostics
        run: python tests/test_v130_dae_algebraic_block_diagnostics.py
      - name: Boundary-compatible Heat-Wave candidate source contracts
        run: python tests/test_v130_heat_wave_boundary_compatibility.py
      - name: Original Heat-Wave corrected initial-state CN full trajectory source tests
        run: python tests/test_v130_heat_wave_compatible_cn.py
      - name: SuperLU_DIST first-step TS diagnostics source checks
        run: python tests/test_v130_heat_wave_superlu_step_diagnostic.py
      - name: Heat-Wave identical CN Jacobian LU replay source gates
        run: python tests/test_v130_hw_cn_identical_lu.py
      - name: SuperLU_DIST original CN permutation sweep source gates
        run: python tests/test_v130_hw_superlu_permutation_sweep.py
      - name: Exact original CN matrix left-row matching contracts
        run: python tests/test_v130_hw_cn_exact_row_matching.py
      - name: Original TS Python row-matched PC source contracts
        run: python tests/test_v130_hw_matched_pc.py
      - name: Original Heat-Wave four-CN MUMPS vs row-matched LU parity
        run: python tests/test_v130_hw_cn_matched_lu_parity.py
      - name: Universal FE pilot scope and GWFL polynomial grammar (source only)
        run: python tests/test_v130_universal_fe_projection_spec.py
      - name: Universal source-only FE L2 initialization and expression grammar
        run: python tests/test_v130_fe_initial_projection.py
      - name: All production GetFEM mass and tangent bridges use COO
        run: python tests/test_v130_nonlinear_coo_assembly.py
      - name: Immutable published source bytes
        run: python scripts/check-v130-published-immutable.py
      - name: Report native gate still required
        run: echo "Source-only PASS does not certify the 7689-DOF Heat-Wave GetFEM/PETSc CN physics"
