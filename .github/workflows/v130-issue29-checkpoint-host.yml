name: SCRIMP v1.3.0 issue 29 checkpoint host gate

on:
  push:
    branches: [release/1.3.0-preparation]
    paths:
      - "sandbox/v130_checkpoint_state.py"
      - "sandbox/probe_v130_checkpoint_restart.py"
      - "sandbox/compare_v130_checkpoint_restart.py"
      - "scripts/run-v130-checkpoint-restart.sh"
      - "tests/test_v130_checkpoint_state.py"
      - "tests/test_v130_checkpoint_restart.py"
      - ".github/workflows/v130-issue29-checkpoint-host.yml"
  pull_request:
    paths:
      - "sandbox/v130_checkpoint_state.py"
      - "sandbox/probe_v130_checkpoint_restart.py"
      - "sandbox/compare_v130_checkpoint_restart.py"
      - "scripts/run-v130-checkpoint-restart.sh"
      - "tests/test_v130_checkpoint_state.py"
      - "tests/test_v130_checkpoint_restart.py"
      - ".github/workflows/v130-issue29-checkpoint-host.yml"

jobs:
  checkpoint-host:
    name: Checkpoint serialization, MPI guards, syntax and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host-only dependency
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile all #29 source files before any native run
        run: |
          python -m py_compile \
            sandbox/v130_checkpoint_state.py \
            sandbox/probe_v130_checkpoint_restart.py \
            sandbox/compare_v130_checkpoint_restart.py \
            tests/test_v130_checkpoint_state.py \
            tests/test_v130_checkpoint_restart.py
          bash -n scripts/run-v130-checkpoint-restart.sh
      - name: Reject corrupted and physically incompatible checkpoints
        run: |
          python -m unittest -v \
            tests.test_v130_checkpoint_state \
            tests.test_v130_checkpoint_restart
