name: v1.3.0 GHCR immutable-digest clean-install acceptance

# Release-candidate smoke on a NEW GitHub-hosted Ubuntu AMD64 VM.
# Push a tag v1.3.0-rcN pointing to the exact source revision used to
# build/publish ghcr.io/g-haine/scrimp:1.3.0-dist-rcN.
# The registry index digest is resolved at runtime, then pinned for
# all Docker operations; the source revision is read from that Git tag.
# No rebuilding GetFEM/PETSc and no locally cached candidate image.
on:
  push:
    tags:
      - "v1.3.0-rc*"
  # Manual rerun is supported when this workflow is on the default
  # branch (GitHub's workflow_dispatch requirement).
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Existing immutable Git tag, e.g. v1.3.0-rc4"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  ghcr-clean-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCRIMP_DOCKER_NO_SUDO: "1"

    steps:
      - name: Check out exactly the release-candidate Git tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag || github.ref_name }}
          persist-credentials: false

      - name: Derive expected revision and GHCR tag from immutable Git tag
        shell: bash
        env:
          CANDIDATE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_TAG" =~ ^v1[.]3[.]0-rc([1-9][0-9]*)$ ]]; then
            echo "FAIL: expected a tag v1.3.0-rcN with N>=1" >&2
            exit 2
          fi
          rc_number="${BASH_REMATCH[1]}"
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$(git rev-parse HEAD^{commit})"
          test -z "$(git status --porcelain --untracked-files=no)"

          image_tag="ghcr.io/g-haine/scrimp:1.3.0-dist-rc${rc_number}"
          printf 'SCRIMP_V130_EXPECT_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
          printf 'SCRIMP_V130_RC_GIT_TAG=%s\n' "$CANDIDATE_TAG" >> "$GITHUB_ENV"
          printf 'SCRIMP_V130_CANDIDATE_IMAGE_TAG=%s\n' "$image_tag" >> "$GITHUB_ENV"
          echo "Source tag: $CANDIDATE_TAG"
          echo "Exact source revision: $revision"
          echo "Candidate registry tag: $image_tag"

      - name: Verify fresh Ubuntu AMD64 runner and absent candidate image
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          echo "Runner: $RUNNER_OS / $(uname -m)"
          docker version
          df -h /
          if docker image inspect "$SCRIMP_V130_CANDIDATE_IMAGE_TAG" >/dev/null 2>&1; then
            echo "FAIL: candidate image already present in the runner's Docker daemon" >&2
            exit 2
          fi
          echo "PASS: no pre-existing SCRIMP candidate image in the runner"

      - name: Authenticate to GHCR using the ephemeral GitHub Actions identity
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A private package must grant this repository Actions read access.
          # Never put a personal PAT in the repository or workflow logs.
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Resolve the GHCR OCI index digest and pull immutably
        shell: bash
        run: |
          set -euo pipefail
          registry_info="$(docker buildx imagetools inspect "$SCRIMP_V130_CANDIDATE_IMAGE_TAG")"
          printf '%s\n' "$registry_info"
          index_digest="$(printf '%s\n' "$registry_info" | awk '$1=="Digest:" {print $2; exit}')"
          if [[ ! "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "FAIL: no valid OCI registry index digest for candidate tag" >&2
            exit 2
          fi
          pinned_image="ghcr.io/g-haine/scrimp@${index_digest}"
          docker pull --platform linux/amd64 "$pinned_image"

          # Fail closed if the mutable candidate tag was moved during the pull.
          current_digest="$(docker buildx imagetools inspect "$SCRIMP_V130_CANDIDATE_IMAGE_TAG" |
            awk '$1=="Digest:" {print $2; exit}')"
          test "$current_digest" = "$index_digest"

          revision="$(docker image inspect --format \
            '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$pinned_image")"
          platform="$(docker image inspect --format \
            '{{.Os}}/{{.Architecture}}' "$pinned_image")"
          test "$revision" = "$SCRIMP_V130_EXPECT_REVISION"
          test "$platform" = linux/amd64

          printf 'SCRIMP_V130_DISTRIBUTION_IMAGE=%s\n' "$pinned_image" >> "$GITHUB_ENV"
          printf 'SCRIMP_V130_OCI_INDEX_DIGEST=%s\n' "$index_digest" >> "$GITHUB_ENV"
          echo "PASS: immutable GHCR pull / source revision / AMD64 platform match"
          echo "Registry digest: $index_digest"
          echo "Pulled config ID: $(docker image inspect --format '{{.Id}}' "$pinned_image")"
          df -h /

      - name: Verify exact source/image match for the user ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCRIMP_V130_EXPECT_REVISION"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PASS: independent user ZIP source is the image's recorded Git revision"

      - name: Run source-independent user ZIP, serial physics, output and MPI gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-v130-docker-distribution-gate.sh

      - name: Verify image-internal real Heat-Wave PDE at MPI 1 and 2
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-v130-distribution-heat-wave-mpi-parity.sh

      - name: Record immutable artifact provenance and runner scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def docker_info(fmt):
              return subprocess.check_output([
                  "docker", "image", "inspect", "--format", fmt,
                  os.environ["SCRIMP_V130_DISTRIBUTION_IMAGE"],
              ], text=True).strip()

          evidence = {
              "status": "PASS_GHCR_FRESH_UBUNTU_VM_INSTALL_AND_MPI_PHYSICS",
              "candidate_git_tag": os.environ["SCRIMP_V130_RC_GIT_TAG"],
              "candidate_registry_tag": os.environ["SCRIMP_V130_CANDIDATE_IMAGE_TAG"],
              "ghcr_index": os.environ["SCRIMP_V130_DISTRIBUTION_IMAGE"],
              "ghcr_index_digest": os.environ["SCRIMP_V130_OCI_INDEX_DIGEST"],
              "local_pulled_image_id": docker_info("{{.Id}}"),
              "oci_source_revision": docker_info(
                  '{{index .Config.Labels "org.opencontainers.image.revision"}}'
              ),
              "platform": docker_info("{{.Os}}/{{.Architecture}}"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "commit": os.environ["SCRIMP_V130_EXPECT_REVISION"],
              "gates": [
                  "PASS_STANDALONE_ZIP_IMAGE_SERIAL_MPI_STARTUP",
                  "PASS_NATIVE_HEAT_WAVE_MPI1_MPI2_HAMILTONIAN_PARITY",
              ],
              "not_tested": [
                  "VS Code GUI F5/F10 on a genuinely new desktop",
                  "Windows/macOS or non-AMD64",
                  "global MPI equivalence or full-field parity",
                  "actual public v1.3.0 release assets",
              ],
          }
          target = Path("sandbox/outputs/v130-ghcr-fresh-runner-summary.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Preserve bounded release acceptance logs and ZIP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v130-ghcr-immutable-fresh-ubuntu-acceptance
          path: |
            sandbox/outputs/v130-ghcr-fresh-runner-summary.json
            sandbox/outputs/v130-docker-distribution-*/
            sandbox/outputs/v130-distribution-heat-wave-mpi-*/
          if-no-files-found: warn
          retention-days: 30
