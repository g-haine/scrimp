name: Python source checks

on: [push, pull_request]

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile modified Python sources
        run: |
          python -m py_compile scrimp/dphs.py scrimp/utils/linalg.py scrimp/utils/profiling.py tests/test_profiling.py tests/test_parallel_powers.py tests/test_mpi_algebra.py sandbox/viscous_swe_2d_mpi.py sandbox/test_petsc_mumps_reset.py sandbox/check_petsc_mumps_symbolic_reuse.py sandbox/check_acoustic_state_parity.py sandbox/check_swe_implicit_jacobian.py sandbox/check_getfem_mpi_rhs.py sandbox/replay_petsc_mumps_snapshot.py sandbox/bench_acoustic_2d.py sandbox/analyze_acoustic_scaling.py sandbox/check_acoustic_energy_mpi.py sandbox/analyze_acoustic_power_balance.py sandbox/smoke_modern_stack.py sandbox/diagnose_getfem_mpi_assembly.py sandbox/analyze_getfem_mpi_assembly.py scripts/audit-v130-docker-context.py tests/test_getfem_timing_patch.py
      - name: Validate opt-in SCRIMP profiling
        run: |
          python -m unittest -v tests.test_profiling
      - name: Validate native GetFEM MPI timing patch
        run: |
          python -m unittest -v tests.test_getfem_timing_patch
      - name: Validate PETSc optional -info default (source-only)
        run: |
          python -m unittest -v tests.test_petsc_option_defaults
      - name: Validate candidate context, shell entry points and user project template
        run: |
          python3 scripts/audit-v130-docker-context.py
          bash -n scripts/build-v130-docker-candidate.sh scripts/smoke-v130-docker-candidate.sh scripts/run-v130-docker-simulation.sh
          python3 -m unittest -v tests.test_project_starter
      - name: Validate asynchronous binary I/O protocol (no MPI/PETSc)
        run: |
          python -m pip install 'numpy>=1.24,<3'
          python -m py_compile scrimp/utils/async_binary_trajectory.py sandbox/async_binary_trajectory.py sandbox/check_async_binary_mpi.py sandbox/probe_async_binary_mpi.py sandbox/verify_async_acoustic.py sandbox/compare_async_acoustic.py sandbox/verify_async_swe.py sandbox/compare_async_swe.py tests/test_async_binary_trajectory.py tests/test_async_swe_comparison.py
          bash -n sandbox/run_async_binary_smoke.sh sandbox/run_async_acoustic_parity.sh sandbox/run_async_swe_parity.sh
          python -m unittest -v tests.test_async_binary_trajectory tests.test_async_swe_comparison
      - name: Validate compact matrix algebra and A/B gates (no PETSc)
        run: |
          python -m py_compile scrimp/utils/matrix_memory.py scrimp/utils/phase_memory_audit.py sandbox/matrix_memory_metrics.py sandbox/compare_compact_matrix.py sandbox/analyze_phase_memory.py tests/test_matrix_memory.py tests/test_compact_matrix_comparison.py tests/test_phase_memory_audit.py
          bash -n sandbox/run_compact_matrix_parity.sh
          python -m unittest -v tests.test_matrix_memory tests.test_compact_matrix_comparison tests.test_phase_memory_audit
      - name: Validate pH-DAE block ordering and MPI sparse audit (no PETSc)
        run: |
          python -m pip install 'scipy>=1.10,<2'
          python -m py_compile scrimp/utils/mesh.py scrimp/utils/ph_block_layout.py sandbox/audit_ph_blocks.py sandbox/compare_ph_block_audits.py sandbox/diagnose_ph_block_parity.py sandbox/compare_raw_getfem_petsc.py tests/test_ph_block_layout.py tests/test_ph_block_comparison.py tests/test_getfem_bridge_localization.py tests/test_concentric_region_integrity.py
          bash -n sandbox/run_ph_block_audit.sh
          python -m unittest -v tests.test_ph_block_layout tests.test_ph_block_comparison tests.test_getfem_bridge_localization tests.test_concentric_region_integrity
      - name: Verify first user tutorial string, documentation and installation gates (source-only)
        run: |
          python -m py_compile examples/wave_1d.py tests/test_v130_wave_1d_tutorial.py
          bash -n scripts/run-v130-first-wave-1d-acceptance.sh
          python tests/test_v130_wave_1d_tutorial.py
          python scripts/check-v130-published-immutable.py
      - name: Validate promoted conforming interfaces and MPI VTK defaults (no GetFEM/PETSc)
        run: |
          python -m py_compile \
            scrimp/utils/production_policy.py \
            scrimp/interface.py \
            scrimp/interface_discovery.py \
            scrimp/interface_deferred.py \
            scrimp/interface_ownership.py \
            scrimp/interface_assembly_plan.py \
            sandbox/v130_pv_root_only_audit.py \
            sandbox/v130_interface_csr_parity.py \
            sandbox/probe_v130_auto_interface_mpi_cn.py \
            tests/test_v130_interface_pv_production_policy.py
          bash -n \
            scripts/run-v130-production-defaults.sh \
            scripts/run-v130-auto-interface-mpi-cn.sh \
            scripts/run-v130-auto-interface-mpi-pv-root-only.sh
          for source_test in \
            tests/test_v130_interface_topology.py \
            tests/test_v130_interface_ownership.py \
            tests/test_v130_interface_assembly_plan.py \
            tests/test_v130_interface_deferred.py \
            tests/test_v130_hw_facet_collector_regions.py \
            tests/test_v130_heat_wave_outward_signs.py \
            tests/test_v130_interface_mpi_csr_parity.py \
            tests/test_v130_auto_interface_mpi_cn_comparator.py \
            tests/test_v130_interface_pv_production_policy.py; do
            python "$source_test"
          done
          python scripts/check-v130-published-immutable.py
      - name: Validate coenergy MPI physical power and full-trajectory gates (no PETSc)
        run: |
          python -m py_compile sandbox/verify_coenergy_power_mpi.py sandbox/compare_coenergy_power_mpi.py tests/test_coenergy_power_mpi.py
          bash -n sandbox/run_coenergy_power_mpi.sh
          python -m unittest -v tests.test_coenergy_power_mpi
      - name: Validate native constitutive MUMPS/Schur probe gates (no PETSc)
        run: |
          python -m py_compile sandbox/probe_constitutive_mumps_schur.py sandbox/compare_constitutive_mumps_schur.py tests/test_constitutive_schur.py
          bash -n sandbox/run_constitutive_mumps_schur.sh
          python -m unittest -v tests.test_constitutive_schur
      - name: Validate v1.2.0 versus COO/MPI benchmark figures
        run: |
          python -m pip install 'matplotlib>=3.7,<4'
          python -m py_compile sandbox/bench_wave_release_scaling.py sandbox/analyze_v130_wave_benchmark.py sandbox/analyze_v130_large_wave_scaling.py sandbox/plot_release120_coo_scaling.py sandbox/diagnose_release120_states.py tests/test_release120_scaling_plots.py tests/test_mumps_numeric_reuse.py tests/test_v130_wave_figures.py tests/test_v130_large_wave_scaling.py tests/test_initial_consistency_sync.py
          bash -n sandbox/run_release120_coo_scaling.sh sandbox/run_v130_wave_benchmark.sh sandbox/run_v130_numeric_reuse_smoke.sh sandbox/run_v130_large_wave_scaling.sh sandbox/run_wave_initial_sync_probe.sh sandbox/run_wave_initial_state_regression.sh sandbox/run_coo_factorization_probe.sh
          python -m py_compile sandbox/analyze_v130_wave_benchmark.py tests/test_mumps_numeric_reuse.py
          python -m unittest -v tests.test_release120_scaling_plots tests.test_v130_wave_figures tests.test_v130_large_wave_scaling tests.test_initial_consistency_sync
      - name: Validate DAE initial-state, algebraic projection and CN physical power diagnostics
        run: |
          python -m py_compile scrimp/utils/dae_initialization.py sandbox/probe_v130_core_dae_initial.py sandbox/compare_v130_core_dae_initial.py sandbox/probe_v130_dissipative_core_dae.py sandbox/compare_v130_dissipative_core_dae.py sandbox/verify_v130_default_promotion.py sandbox/check_v130_default_options.py sandbox/check_v130_shallow_water_mass_jacobian.py sandbox/compare_v130_shallow_water_mass_jacobian.py sandbox/probe_v130_shallow_explicit_ts.py sandbox/compare_v130_shallow_explicit_ts.py tests/test_v130_shallow_explicit_ts.py tests/test_v130_shallow_mass_jacobian.py tests/test_v130_fully_explicit_bricks.py tests/test_v130_dissipative_core_dae.py tests/test_v130_default_migration.py tests/test_v130_default_promotion.py sandbox/audit_v130_wave_dae_initial.py sandbox/compare_v130_wave_dae_initial.py sandbox/probe_v130_wave_fixed_dynamics.py sandbox/compare_v130_wave_fixed_dynamics.py sandbox/compare_v130_wave_control_compatibility.py sandbox/solve_v130_dae_algebraic_block.py sandbox/audit_v130_wave_initializers.py sandbox/compare_v130_wave_initializers.py sandbox/probe_v130_petsc_mpi_initial.py sandbox/compare_v130_petsc_mpi_initial.py tests/test_dae_algebraic_initialization_core.py tests/test_v130_wave_dae_audit.py tests/test_v130_dae_algebraic_feasibility.py tests/test_v130_wave_initializers.py tests/test_v130_petsc_mpi_dae_initial.py
          bash -n scripts/run-v130-dae-initial-audit.sh scripts/run-v130-fixed-dynamics-probe.sh scripts/run-v130-exact-fe-initial-probe.sh scripts/run-v130-wave-initializer-physics.sh scripts/run-v130-petsc-mpi-dae-initial.sh scripts/run-v130-core-dae-initial.sh scripts/run-v130-second-linear-dae.sh scripts/run-v130-dae-default-promotion.sh scripts/run-v130-shallow-mass-jacobian.sh scripts/run-v130-shallow-explicit-physical-ts.sh
          python -m unittest -v tests.test_dae_algebraic_initialization_core tests.test_v130_dissipative_core_dae tests.test_v130_default_migration tests.test_v130_default_promotion tests.test_v130_shallow_mass_jacobian tests.test_v130_shallow_explicit_ts tests.test_v130_fully_explicit_bricks tests.test_v130_wave_dae_audit tests.test_v130_dae_algebraic_feasibility tests.test_v130_wave_initializers tests.test_v130_petsc_mpi_dae_initial
      - name: Validate issue #6 MPI viscous SWE comparator contracts (no native PETSc)
        run: |
          python -m py_compile sandbox/compare_v130_issue6_viscous_mpi.py tests/test_v130_issue6_viscous_mpi.py
          bash -n scripts/run-v130-issue6-viscous-mpi.sh
          bash -n scripts/run-v130-issue6-init-probe.sh
          python -m py_compile sandbox/probe_v130_issue28_structure.py
          bash -n scripts/run-v130-issue28-structure.sh
          python -m py_compile sandbox/probe_v130_issue28_feasibility.py
          bash -n scripts/run-v130-issue28-feasibility.sh
          bash -n scripts/run-v130-issue28-P2-geometry.sh
          python -m py_compile sandbox/probe_v130_issue28_normal_orientation.py
          bash -n scripts/run-v130-issue28-native-normal.sh
          python -m py_compile sandbox/probe_v130_issue28_exact_rest.py
          bash -n scripts/run-v130-issue28-exact-rest.sh
          python -m py_compile sandbox/probe_v130_issue28_shallow_initial.py
          bash -n scripts/run-v130-issue28-shallow-initial.sh
          python -m py_compile scrimp/utils/nonlinear_affine_dae.py sandbox/probe_v130_issue28_production_nonlinear_affine.py
          bash -n scripts/run-v130-issue28-production-nonlinear-affine.sh
          python -m py_compile sandbox/probe_v130_issue28_negative_high_index.py
          bash -n scripts/run-v130-issue28-negative-high-index.sh
          python -m py_compile sandbox/probe_v130_issue28_negative_accuracy.py
          bash -n scripts/run-v130-issue28-negative-accuracy.sh
          python -m py_compile sandbox/probe_v130_issue28_production_short_physical.py sandbox/compare_v130_issue28_production_short_physical.py
          bash -n scripts/run-v130-issue28-production-short-physical.sh
          python -m py_compile sandbox/probe_v130_issue28_shallow_short_physical.py
          bash -n scripts/run-v130-issue28-shallow-short-physical.sh
          python -m py_compile sandbox/probe_v130_issue28_shallow_short_physical.py sandbox/compare_v130_issue28_shallow_energy_refinement.py tests/test_v130_issue28_shallow_energy_refinement.py
          bash -n scripts/run-v130-issue28-shallow-energy-refinement.sh
          python -m py_compile sandbox/probe_v130_issue28_differentiated_rank.py
          bash -n scripts/run-v130-issue28-differentiated-rank.sh
          python -m py_compile sandbox/probe_v130_issue28_physical_rhs_y0.py sandbox/compare_v130_issue28_physical_rhs_y0.py tests/test_v130_issue28_physical_rhs_comparator.py
          bash -n scripts/run-v130-issue28-physical-rhs-y0.sh
          python -m unittest -v tests.test_v130_issue28_physical_rhs_comparator
          python -m unittest -v tests.test_v130_issue28_shallow_energy_refinement
          python -m py_compile sandbox/compare_v130_issue28_production_nonlinear_affine.py tests/test_v130_issue28_production_nonlinear_affine_comparator.py
          python -m unittest -v tests.test_v130_issue28_production_nonlinear_affine_comparator
          python -m unittest -v tests.test_v130_issue28_rot_convention
          python -m unittest -v tests.test_v130_issue28_geometry_report
          python -m unittest -v tests.test_v130_issue6_viscous_mpi
      - name: Validate #28 native spinup sandbox diagnostics before Docker (no PETSc)
        run: |
          # Syntax gate covers both past/preliminary and full-ramp experiments.
          python -m py_compile \
            sandbox/probe_v130_issue28_one_cn_spinup.py \
            sandbox/compare_v130_issue28_one_cn_spinup.py \
            sandbox/probe_v130_issue28_cn_refinement.py \
            sandbox/compare_v130_issue28_cn_refinement.py \
            sandbox/probe_v130_issue28_full_spinup.py \
            sandbox/compare_v130_issue28_full_spinup.py \
            tests/test_v130_issue28_one_cn_spinup.py \
            tests/test_v130_issue28_cn_refinement.py \
            tests/test_v130_issue28_full_spinup.py
          bash -n \
            scripts/run-v130-issue28-one-cn-spinup.sh \
            scripts/run-v130-issue28-cn-refinement.sh \
            scripts/run-v130-issue28-full-spinup.sh
          python -m unittest -v \
            tests.test_v130_issue28_one_cn_spinup \
            tests.test_v130_issue28_cn_refinement \
            tests.test_v130_issue28_full_spinup
      - name: Validate SCRIMP source headers
        run: |
          python -m unittest -v tests.test_python_headers
