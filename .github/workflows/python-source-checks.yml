name: Python source checks

on: [push, pull_request]

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile modified Python sources
        run: |
          python -m py_compile scrimp/dphs.py scrimp/utils/linalg.py scrimp/utils/profiling.py tests/test_profiling.py tests/test_parallel_powers.py tests/test_mpi_algebra.py sandbox/viscous_swe_2d_mpi.py sandbox/test_petsc_mumps_reset.py sandbox/check_petsc_mumps_symbolic_reuse.py sandbox/check_acoustic_state_parity.py sandbox/check_swe_implicit_jacobian.py sandbox/check_getfem_mpi_rhs.py sandbox/replay_petsc_mumps_snapshot.py sandbox/bench_acoustic_2d.py sandbox/analyze_acoustic_scaling.py sandbox/check_acoustic_energy_mpi.py sandbox/analyze_acoustic_power_balance.py sandbox/smoke_modern_stack.py sandbox/diagnose_getfem_mpi_assembly.py sandbox/analyze_getfem_mpi_assembly.py scripts/patch-getfem-mpi-timing.py tests/test_getfem_timing_patch.py
      - name: Validate opt-in SCRIMP profiling
        run: |
          python -m unittest -v tests.test_profiling
      - name: Validate native GetFEM MPI timing patch
        run: |
          python -m unittest -v tests.test_getfem_timing_patch
      - name: Validate asynchronous binary I/O protocol (no MPI/PETSc)
        run: |
          python -m pip install 'numpy>=1.24,<3'
          python -m py_compile scrimp/utils/async_binary_trajectory.py sandbox/async_binary_trajectory.py sandbox/check_async_binary_mpi.py sandbox/probe_async_binary_mpi.py sandbox/verify_async_acoustic.py sandbox/compare_async_acoustic.py sandbox/verify_async_swe.py sandbox/compare_async_swe.py tests/test_async_binary_trajectory.py tests/test_async_swe_comparison.py
          bash -n sandbox/run_async_binary_smoke.sh sandbox/run_async_acoustic_parity.sh sandbox/run_async_swe_parity.sh
          python -m unittest -v tests.test_async_binary_trajectory tests.test_async_swe_comparison
      - name: Validate compact matrix algebra and A/B gates (no PETSc)
        run: |
          python -m py_compile scrimp/utils/matrix_memory.py scrimp/utils/phase_memory_audit.py sandbox/matrix_memory_metrics.py sandbox/compare_compact_matrix.py sandbox/analyze_phase_memory.py tests/test_matrix_memory.py tests/test_compact_matrix_comparison.py tests/test_phase_memory_audit.py
          bash -n sandbox/run_compact_matrix_parity.sh
          python -m unittest -v tests.test_matrix_memory tests.test_compact_matrix_comparison tests.test_phase_memory_audit
      - name: Validate v1.2.0 versus COO/MPI benchmark figures
        run: |
          python -m pip install 'matplotlib>=3.7,<4'
          python -m py_compile sandbox/bench_wave_release_scaling.py sandbox/plot_release120_coo_scaling.py sandbox/diagnose_release120_states.py tests/test_release120_scaling_plots.py
          bash -n sandbox/run_release120_coo_scaling.sh sandbox/analyze_existing_release120_scaling.sh
          python -m unittest -v tests.test_release120_scaling_plots
      - name: Validate SCRIMP source headers
        run: |
          python -m unittest -v tests.test_python_headers
