name: Python source checks

on: [push, pull_request]

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile modified Python sources
        run: |
          python -m py_compile scrimp/dphs.py scrimp/utils/linalg.py tests/test_parallel_powers.py tests/test_mpi_algebra.py sandbox/viscous_swe_2d_mpi.py
      - name: Validate SCRIMP source headers
        run: |
          python -m unittest -v tests.test_python_headers
