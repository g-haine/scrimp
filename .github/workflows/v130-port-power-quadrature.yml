name: v1.3.0 CN port-power quadrature unit regressions

on:
  push:
    branches:
      - release/1.3.0-preparation
    paths:
      - scrimp/utils/power_integration.py
      - scrimp/dphs.py
      - scrimp/port.py
      - tests/test_v130_power_integration.py
      - tests/test_v130_port_generic_sampling.py
      - sandbox/verify_v130_power_quadrature_native.py
      - sandbox/probe_v130_issue30_port_sampling_native.py
      - scripts/run-v130-issue30-port-generic-native.sh
      - .github/workflows/v130-port-power-quadrature.yml
  pull_request:
    paths:
      - scrimp/utils/power_integration.py
      - scrimp/dphs.py
      - scrimp/port.py
      - tests/test_v130_power_integration.py
      - tests/test_v130_port_generic_sampling.py
      - sandbox/verify_v130_power_quadrature_native.py
      - sandbox/probe_v130_issue30_port_sampling_native.py
      - scripts/run-v130-issue30-port-generic-native.sh
      - .github/workflows/v130-port-power-quadrature.yml

jobs:
  source-and-negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pure-numpy test requirement
        run: python -m pip install numpy
      - name: Python syntax
        run: python -m py_compile scrimp/utils/power_integration.py scrimp/dphs.py scrimp/port.py tests/test_v130_power_integration.py tests/test_v130_port_generic_sampling.py sandbox/verify_v130_power_quadrature_native.py sandbox/probe_v130_issue30_port_sampling_native.py
      - name: CN step-power sign and pause/restart negative tests
        run: python tests/test_v130_power_integration.py
      - name: Generic Port.compute native-call AST tests (no GetFEM in CI)
        run: python tests/test_v130_port_generic_sampling.py
      - name: Native driver shell syntax (actual PETSc on user's host)
        run: bash -n scripts/run-v130-issue30-port-generic-native.sh
