name: v1.3.0 compatible rotating SWE MPI4 source/negative guards

on:
  push:
    branches:
      - release/1.3.0-preparation
    paths:
      - sandbox/probe_v130_rotating_controlled_ic.py
      - sandbox/compare_v130_issue6_active_mpi.py
      - scripts/run-v130-rotating-controlled-ic.sh
      - scripts/run-v130-issue6-rotating-mpi4.sh
      - tests/test_v130_issue6_active_mpi.py
      - .github/workflows/v130-issue6-active-mpi-host.yml
  pull_request:
    paths:
      - sandbox/probe_v130_rotating_controlled_ic.py
      - sandbox/compare_v130_issue6_active_mpi.py
      - scripts/run-v130-rotating-controlled-ic.sh
      - scripts/run-v130-issue6-rotating-mpi4.sh
      - tests/test_v130_issue6_active_mpi.py
      - .github/workflows/v130-issue6-active-mpi-host.yml

jobs:
  source-and-negative-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: |
          python -m py_compile sandbox/probe_v130_rotating_controlled_ic.py sandbox/compare_v130_issue6_active_mpi.py tests/test_v130_issue6_active_mpi.py
      - name: Shell syntax
        run: |
          bash -n scripts/run-v130-rotating-controlled-ic.sh
          bash -n scripts/run-v130-issue6-rotating-mpi4.sh
      - name: Lightweight NumPy comparator requirement
        run: python -m pip install numpy
      - name: Mandatory negative controls on rank-local MPI port outputs
        run: python tests/test_v130_issue6_active_mpi.py
      - name: No claims of native MPI qualification in CI
        run: |
          echo "These are host-only negative controls. Run native original GetFEM/PETSc on the qualified user Docker host."
