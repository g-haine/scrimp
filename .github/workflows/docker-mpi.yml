name: Build and validate modern GetFEM MPI image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push validated image to GHCR (experimental tag)'
        type: boolean
        default: false
        required: false
  pull_request:
    paths:
      - docker/**
      - scripts/build-getfem-mpi.sh
      - scripts/install-petsc-python-bindings.sh
      - sandbox/smoke_modern_stack.py
      - sandbox/bench_acoustic_2d.py
      - sandbox/diagnose_getfem_mpi_assembly.py
      - sandbox/analyze_getfem_mpi_assembly.py
      - scrimp/**
      - tests/test_mpi_algebra.py
      - .github/workflows/docker-mpi.yml

permissions:
  contents: read
  packages: write

jobs:
  mpi-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build experimental GetFEM 5.5/NumPy 2 image
        run: |
          docker build --progress=plain \
            --build-arg GETFEM_VERSION=5.5 \
            --build-arg MAKE_JOBS=2 \
            -f docker/Dockerfile -t scrimp-mpi:candidate .
      # ubuntu-24.04 hosted runners may expose only 2 physical CPU slots.
      # OpenMPI must be allowed to start 4 ranks for FUNCTIONAL CI checks.
      # --oversubscribe must never be used for performance benchmarks.
      - name: Verify MPI, NumPy 2, complex PETSc and MUMPS
        run: |
          for n in 1 2 4; do
            docker run --rm --cpus=4 scrimp-mpi:candidate \
              mpiexec --oversubscribe -n "$n" python -u sandbox/smoke_modern_stack.py
          done
      - name: Measure native GetFEM RHS and matrix semantics at 1/2/4 ranks
        run: |
          mkdir -p getfem-assembly
          # Container uses unprivileged mambauser; allow CI artifact writes.
          chmod 777 getfem-assembly
          for n in 1 2 4; do
            docker run --rm --cpus=4 \
              -v "$PWD/getfem-assembly:/artifacts" \
              scrimp-mpi:candidate \
              mpiexec --oversubscribe -n "$n" python -u \
              sandbox/diagnose_getfem_mpi_assembly.py \
              --output "/artifacts/getfem_${n}ranks.json"
          done
          python sandbox/analyze_getfem_mpi_assembly.py \
            --matrix-mode distributed --require-physical-rhs \
            getfem-assembly/*.json
      - name: Preserve GetFEM MPI native assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: getfem-native-mpi-assembly
          path: getfem-assembly/*.json
          if-no-files-found: warn
      - name: Run SCRIMP algebra tests on 1, 2 and 4 ranks
        run: |
          for n in 1 2 4; do
            docker run --rm --cpus=4 scrimp-mpi:candidate \
              mpiexec --oversubscribe -n "$n" python -u -m unittest -v tests.test_mpi_algebra
          done
      - name: Check 2D acoustic-wave physical parity at 1/2/4 ranks
        run: |
          mkdir -p acoustic-mpi
          # Mounted CI directory must be writable by the image's mambauser.
          chmod 777 acoustic-mpi
          for n in 1 2 4; do
            # Functional CI only; hosted runners have insufficient cores
            # for meaningful strong-scaling timings at 4 ranks.
            timeout -k 10s 180s docker run --rm --cpus=4 \
              -e SCRIMP_MUMPS_RESET_PC_ON_JACOBIAN=1 \
              -v "$PWD/acoustic-mpi:/artifacts" \
              scrimp-mpi:candidate \
              mpiexec --oversubscribe -n "$n" \
                python -u sandbox/bench_acoustic_2d.py \
                --mesh 0.2 --final-time 0.002 --dt 0.001 \
                --save-dt 0.001 --output "/artifacts/wave_${n}ranks.json" \
                > "acoustic-mpi/wave_${n}ranks.log" 2>&1 || {
                  cat "acoustic-mpi/wave_${n}ranks.log"
                  exit 1
                }
            echo "Acoustic run with $n ranks:"
            tail -n 40 "acoustic-mpi/wave_${n}ranks.log"
          done
          # This analyzer requires matching DOFs, time discretization,
          # convergence and final field norms. Do not weaken its gates.
          # Use the image's NumPy rather than relying on the host
          # runner having an appropriate Python scientific stack.
          docker run --rm \
            -v "$PWD/acoustic-mpi:/artifacts:ro" \
            scrimp-mpi:candidate \
            python sandbox/analyze_acoustic_scaling.py \
              /artifacts/wave_1ranks.json \
              /artifacts/wave_2ranks.json \
              /artifacts/wave_4ranks.json
          echo 'CI-only timing: oversubscribed; not a scalability result.'
      - name: Preserve 2D acoustic 1/2/4 rank validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrimp-acoustic-mpi-parity
          path: acoustic-mpi/
          if-no-files-found: warn
      - name: Archive resolved package manifest
        run: |
          docker run --rm scrimp-mpi:candidate \
            cat /workspace/scrimp/docker-resolved-spec.txt \
            > docker-resolved-spec.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scrimp-mpi-resolved-conda-spec
          path: docker-resolved-spec.txt
      - name: Login to GHCR (only on explicit opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified experimental image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          docker tag scrimp-mpi:candidate "ghcr.io/${{ github.repository }}:getfem55-mpi-experimental"
          docker push "ghcr.io/${{ github.repository }}:getfem55-mpi-experimental"
